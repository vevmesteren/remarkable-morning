[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remarkable-morning"
version = "0.1.0"
description = "Daily news digest pipeline for reMarkable Paper Pro — fetches 19 sources across EN/DE/FR, curates via LLM, builds a reflowable EPUB, uploads via rmapi."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "the operator"}]
keywords = ["remarkable", "news", "epub", "rss", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "ebooklib>=0.18",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
remarkable-morning = "remarkable_morning.pipeline:main"
remarkable-morning-setup = "remarkable_morning.setup:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage]
omit = ["tests/*"]
